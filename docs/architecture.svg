<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="dsh-subagent-model-notes architecture">
  <style>
    .bg { fill: #0d1117; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 10; }
    .box-accent { fill: #161b22; stroke: #2f81f7; stroke-width: 1.2; }
    .t { fill: #e6edf3; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; font-size: 14px; }
    .h { fill: #e6edf3; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; }
    .m { fill: #8b949e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .s { fill: #8b949e; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; font-size: 12px; }
    .flow { fill: none; stroke: #2f81f7; stroke-width: 1.6; }
    .flow-dim { fill: none; stroke: #6e7681; stroke-width: 1.4; stroke-dasharray: 5 4; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="440" rx="14"/>

  <!-- Browser half -->
  <text class="h" x="40" y="46">Browser half</text>
  <rect class="box" x="40" y="64" width="360" height="96" rx="10"/>
  <text class="t" x="60" y="92">Settings &#8594; Plugins &#8594; Built-in plugin settings</text>
  <text class="t" x="60" y="118">Subagent model notes page</text>
  <text class="s" x="60" y="142">one note per model, authorized badge, save</text>

  <rect class="box" x="40" y="184" width="360" height="96" rx="10"/>
  <text class="t" x="60" y="212">ctx.configForms.get(&#39;subagent-model-notes&#39;)</text>
  <text class="s" x="60" y="236">volatile notes config, revision-fenced mutate</text>
  <text class="s" x="60" y="258">ctx.remote.session.modelCatalog() &#183; official allowlist</text>

  <!-- Host half -->
  <text class="h" x="560" y="46">Host half</text>
  <rect class="box" x="560" y="64" width="360" height="96" rx="10"/>
  <text class="m" x="580" y="92">system-prompt/assemble</text>
  <text class="s" x="580" y="116">read notes + Session route policy</text>
  <text class="s" x="580" y="138">insert section after the delegation tool</text>

  <rect class="box" x="560" y="184" width="360" height="96" rx="10"/>
  <text class="m" x="580" y="212">subagentModelSelectionPolicy</text>
  <text class="s" x="580" y="236">written by @deepseek-ai/dsh-tool-subagent</text>
  <text class="s" x="580" y="258">only authorized routes can appear in a note</text>

  <rect class="box-accent" x="330" y="330" width="300" height="80" rx="12"/>
  <text class="t" x="356" y="362">System prompt seen by the agent</text>
  <text class="m" x="356" y="386">Subagent model notes &#8212; route &#8212; note</text>

  <!-- Arrows -->
  <path class="flow" d="M400 112 H552"/>
  <path class="flow-dim" d="M556 232 H472 V112"/>
  <path class="flow" d="M392 165 V184" />
  <path class="flow" d="M740 160 V184"/>
  <path class="flow" d="M740 280 C740 320 640 330 634 344"/>
  <text class="s" x="612" y="322">assembled per model step</text>
</svg>
